# uv workspace root (ADR §9.2, D3). Not itself a package: it only pins the dev toolchain
# and lists the three Python packages.
[project]
name = "arp-notes-workspace"
version = "0.0.0"
description = "Workspace root for arp-notes. Not published."
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/core", "packages/cli", "packages/conformance"]

[tool.uv.sources]
arp-notes-core = { workspace = true }
arp-notes = { workspace = true }
arp-notes-conformance = { workspace = true }

[dependency-groups]
dev = [
    "arp-notes-core",
    "arp-notes",
    "arp-notes-conformance",
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "jsonschema>=4.21",
    "pytest-postgresql>=7",
    "psycopg[binary]>=3.2",
]

[tool.pytest.ini_options]
testpaths = ["packages/core/tests", "packages/cli/tests", "packages/conformance/tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["packages/ui"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["packages/core", "packages/cli", "packages/conformance"]
exclude = ["**/node_modules", "**/.venv"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
