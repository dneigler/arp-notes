[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arp-notes"
version = "0.1.0.dev0"
description = "arp-notes CLI: scan, sync and pull notes between a notes tool and an arp-notes host app. Moves verbatim bytes; the LLM never carries them."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
keyring = ["keyring>=25"]

[project.scripts]
arp-notes = "arp_notes_cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["arp_notes_cli"]
