[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arp-notes-core"
version = "0.1.0rc1"
description = "arp-notes server core: ports, sync, attachments, enrichment, FastAPI routers and MCP tool specs. ORM-free and app-agnostic."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
testing = [
    "psycopg[binary]>=3.2",
    "pytest-postgresql>=7",
    "moto[s3]>=5",
]

[tool.hatch.build.targets.wheel]
packages = ["arp_notes"]
