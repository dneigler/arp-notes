[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arp-notes-conformance"
version = "0.1.0rc1"
description = "Black-box conformance kit for arp-notes hosts: drives any implementation over HTTP and MCP."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pytest>=8",
    "jsonschema>=4",
]

[tool.hatch.build.targets.wheel]
packages = ["arp_notes_conformance"]
